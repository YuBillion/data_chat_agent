[project]
name = "data-chat-agent-harness"
version = "0.2.0"
description = "Production multi-agent LangGraph harness for analytics and catalog Q&A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "asyncmy>=0.2.14",
    "cryptography>=46.0.7",
    "elasticsearch[async]>=8,<9",
    "fastapi[standard]>=0.135.3",
    "greenlet>=3.4.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.10.1",
    "jieba>=0.42.1",
    "langchain>=1.2.15",
    "langchain-deepseek>=1.0.1",
    "langchain-huggingface>=1.2.1",
    "langgraph>=1.1.6",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langfuse>=3.0.0",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "opentelemetry-api>=1.35.0",
    "opentelemetry-exporter-otlp-proto-http>=1.35.0",
    "opentelemetry-exporter-prometheus>=0.56b0",
    "opentelemetry-instrumentation-fastapi>=0.56b0",
    "opentelemetry-instrumentation-httpx>=0.56b0",
    "opentelemetry-instrumentation-redis>=0.56b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.56b0",
    "opentelemetry-sdk>=1.35.0",
    "psycopg[binary,pool]>=3.2.9",
    "pydantic-settings>=2.10.1",
    "PyJWT[crypto]>=2.10.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.17.1",
    "redis[hiredis]>=6.2.0",
    "sqlalchemy>=2.0.49",
    "sqlglot>=27.0.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.31.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/**/*.py" = ["I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "integration: requires explicitly configured external PostgreSQL/Redis services",
]
