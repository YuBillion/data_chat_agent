name: data-chat-agent

services:
  migrate:
    build:
      context: ..
      target: migrate
    env_file:
      - ../.env
    environment:
      POSTGRES_DSN: ${POSTGRES_MIGRATION_DSN:?set POSTGRES_MIGRATION_DSN}
    command: ["python", "-m", "app.scripts.migrate"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp/app:size=64m
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ..
      target: api
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp/app:size=128m
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    build:
      context: ..
      target: worker
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp/app:size=256m
    deploy:
      resources:
        limits:
          memory: 4g
    logging:
      options:
        max-size: "20m"
        max-file: "5"

  web:
    build:
      context: ../frontend
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 256m

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol/config.yaml"]
    env_file:
      - ../.env
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
